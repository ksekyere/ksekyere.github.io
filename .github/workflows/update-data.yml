# Rebuilds data/country_conditions.json on the 5th of each month and commits it if anything changed.
# It can also be run by hand: GitHub repository > Actions > Update country data > Run workflow.
name: Update country data

on:
  schedule:
    - cron: "17 9 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/build_country_conditions.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update country conditions data"
          git push
